[package]
name = "bloog"
version = "0.8.1"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros", "form"] }
base64 = { version = "0.23.1" }
chrono = { version = "0.4.45" , features = ["serde", "rkyv-64", "alloc"]}
clap = { version = "4.6.7", features = ["derive", "env", "error-context", "help", "std", "usage", "cargo"], default-features = false }
futures = { version = "0.3.34" }
image = { version = "0.25.10", features = ["jpeg", "png", "webp"] }
itertools = { version = "0.15.0" }
maud = { version = "0.27.0", features = ["axum"] }
object_store = { version = "0.14.2", features = ["http", "aws"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
url = { version = "2.5.8" }
serde = { version = "1.0.229", features = ["derive"] }
anyhow = { version = "1.0.104" }
postcard = { version = "1.1.3", features = ["use-std"]}
bytes = { version = "1.12.1" }
pulldown-cmark = { version = "0.13.4", features = ["html"] }
xmlparser = { version = "0.13.6" }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
# Provides the API component of OTEL
opentelemetry = { version = "0.33.1", default-features = false, features = ["trace"] }
# Provides the SDK implementations of the OTEL API
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["trace", "logs"] }
# Provides the tracing layer for OTEL
tracing-opentelemetry = { version = "0.34.0", default-features = false}
# Provides the network transport for OTEL
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
# Provides the Rust APIs and macros for tracing
tracing = { version = "0.1.44" }
# Provides the Rust apis for a global subscriber listing for spans.
tracing-subscriber = { version = "0.3.23" , default-features = false, features = ["std", "fmt", "ansi", "registry", "env-filter"]}
# Provides the axum middleware for emitting spans
tower-http = { version = "0.7.1", default-features = false, features = ["trace"] }
http = { version = "1.5.0" }
percent-encoding = { version = "2.3.2" }
regex = { version = "1.13.1" }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
serde_json = { version = "1.0.154" }
